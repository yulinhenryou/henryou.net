        <h1><span class="title-part">阅读有感</span><span class="title-part">（9月19日）</span></h1>
      </header>
      <div class="prose">
        <p>世间的热闹取之不尽，人的心力却有尽时。怕的不是一季无收，而是尝惯了伸手便得的甜，便再也不肯俯身耕种。总要留些耐心，给那些尚未开花，却值得一天天照料的事。</p>
        <figure class="photo">
          <img src="/assets/writing/reading-reflections-2026-09-19/harbour-bridge-monochrome.webp" alt="黑白影像中的悉尼海港大桥" width="496" height="346" decoding="async">
        </figure>
        <p>仔细想来，人若一味追逐即时满足的快感，便容易渐渐失去为长期价值付出耐心的能力。而人生中真正值得追求的事，往往都非一日之功。令人惋惜的是，许多人尚未察觉，持续专注的能力便已在日常的消遣中慢慢消退。从互联网到 AI 时代，低成本、近乎零门槛的信息、娱乐和服务只会越来越多，也越来越触手可及。到那时，我们是否还愿意每天留出十分钟，安静地读一本书？即使有心，又是否还留得住那份专注？</p>
      </div>
    </article>
